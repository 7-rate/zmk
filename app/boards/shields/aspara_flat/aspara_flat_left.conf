CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_RGB_INDICATOR=y
CONFIG_ZMK_BOOTLOADER_LED_INDICATOR=y
CONFIG_ZMK_BOOTLOADER_LED_TIMEOUT_MS=50
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

CONFIG_ZMK_SLEEP=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_MAX_PAIRED=4

# Reduce split key event drops/dupes on fast typing bursts (default 5/5/20)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=10
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=10
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=30
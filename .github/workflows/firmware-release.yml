name: Firmware Release

# Tag を push したときに task build (west build) で left/right の firmware をビルドし、
# aspara_flat_left_[tag].uf2 / aspara_flat_right_[tag].uf2 として GitHub Release に添付する。
# リポジトリのActionsポリシーでマーケットプレイスのアクション(uses:)が禁止されているため、
# checkout・リリース作成も含めてすべて git / gh / docker コマンドのみで実行する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Build ZMK dev container image
        run: docker build -t zmk-dev:ci .devcontainer

      - name: Initialize and update west workspace
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspaces/zmk" -w /workspaces/zmk zmk-dev:ci \
            bash -lc "west init -l app && west update --fetch-opt=--filter=tree:0 && west zephyr-export"

      - name: Build left/right firmware (task build)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspaces/zmk" -w /workspaces/zmk zmk-dev:ci \
            bash -lc "task build"

      - name: Collect firmware artifacts
        run: |
          mkdir -p dist
          cp app/build/left/zephyr/zmk.uf2 "dist/aspara_flat_left_${GITHUB_REF_NAME}.uf2"
          cp app/build/right/zephyr/zmk.uf2 "dist/aspara_flat_right_${GITHUB_REF_NAME}.uf2"

      - name: Publish GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.uf2 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

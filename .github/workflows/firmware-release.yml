name: Firmware Release

# Tag を push したときに task build (west build) で left/right の firmware をビルドし、
# left_[version].uf2 / right_[version].uf2 として GitHub Release に添付する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve firmware version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build ZMK dev container image
        run: docker build -t zmk-dev:ci .devcontainer

      # zephyr/, modules/, tools/ are populated by `west update` and are not
      # tracked in git (see .gitignore) - cache them to speed up repeat builds.
      - name: Cache west workspace
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
          key: ${{ runner.os }}-release-${{ env.cache-name }}-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ env.cache-name }}-

      - name: Initialize and update west workspace
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspaces/zmk" -w /workspaces/zmk zmk-dev:ci \
            bash -lc "west init -l app && west update --fetch-opt=--filter=tree:0 && west zephyr-export"

      - name: Build left/right firmware (task build)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspaces/zmk" -w /workspaces/zmk zmk-dev:ci \
            bash -lc "task build"

      - name: Collect firmware artifacts
        run: |
          mkdir -p dist
          cp app/build/left/zephyr/zmk.uf2 "dist/left_${{ steps.version.outputs.version }}.uf2"
          cp app/build/right/zephyr/zmk.uf2 "dist/right_${{ steps.version.outputs.version }}.uf2"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aspara_flat-firmware-${{ steps.version.outputs.version }}
          path: dist/*.uf2

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.uf2
